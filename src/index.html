<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Tool</title>
  <link rel="stylesheet" href="css/app.css" />
  <!-- Bibliotecas locais offline -->
  <script src="vendor/pdf-lib.min.js"></script>
  <script src="vendor/pdf.min.js"></script>
</head>
<body>

  <main>
    <!-- Tela Inicial com os 14 cards de ferramentas -->
    <div id="home-screen">
      <div class="hero-header">
        <div class="hero-header-top">
          <div>
            <h1 class="app-title">PDF Tool <span class="version-tag">v2.0.1</span></h1>
            <p class="subtitle">Organize, assine, tarje, extraia texto com OCR nativo e converta seus PDFs com 100% de privacidade offline.</p>
          </div>
          <div class="theme-switch-wrap" id="home-theme-switch">
            <button type="button" class="theme-btn" data-theme-mode="light" title="Modo Claro">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
              <span>Claro</span>
            </button>
            <button type="button" class="theme-btn" data-theme-mode="dark" title="Modo Escuro">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
              <span>Escuro</span>
            </button>
            <button type="button" class="theme-btn active" data-theme-mode="auto" title="Automático (Sistema)">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
              <span>Auto</span>
            </button>
          </div>
        </div>
        <div class="category-filter-bar" id="category-filter-bar">
          <button type="button" class="category-pill active" data-category="all">Todas <span class="count">14</span></button>
          <button type="button" class="category-pill" data-category="organize">Organizar <span class="count">4</span></button>
          <button type="button" class="category-pill" data-category="security">Segurança & Tarja <span class="count">4</span></button>
          <button type="button" class="category-pill" data-category="content">Conteúdo & OCR <span class="count">3</span></button>
          <button type="button" class="category-pill" data-category="convert">Converter <span class="count">3</span></button>
        </div>
      </div>
      <div class="grid" id="tool-grid"></div>
    </div>

    <!-- Área de Trabalho / Workspace de cada ferramenta -->
    <div class="workspace" id="workspace">
      <div class="workspace-top-bar">
        <div class="workspace-nav-left">
          <button class="back-btn" onclick="goHome()">
            <span class="back-arrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></span>
            <span>Voltar às ferramentas</span>
          </button>
          <div class="tool-switcher-dropdown" id="tool-switcher-dropdown">
            <button type="button" class="tool-switcher-btn" id="tool-switcher-btn" onclick="toggleToolSwitcher(event)">
              <span id="current-tool-label">Ferramenta</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="tool-switcher-menu hidden" id="tool-switcher-menu"></div>
          </div>
        </div>
        <div class="theme-switch-wrap" id="workspace-theme-switch">
          <button type="button" class="theme-btn" data-theme-mode="light" title="Modo Claro">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          </button>
          <button type="button" class="theme-btn" data-theme-mode="dark" title="Modo Escuro">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          </button>
          <button type="button" class="theme-btn active" data-theme-mode="auto" title="Automático (Sistema)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
          </button>
        </div>
      </div>
      <div id="workspace-content"></div>
    </div>
  </main>

  <!-- Modal Quick Look para Visualização Ampliada de Página -->
  <div id="quick-look-overlay" class="quick-look-overlay hidden">
    <div class="quick-look-window">
      <div class="quick-look-header">
        <div class="quick-look-title" id="quick-look-title">Página 1 de 1</div>
        <button type="button" class="quick-look-close" id="quick-look-close" title="Fechar (Esc)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="quick-look-body">
        <button type="button" class="quick-look-nav prev" id="quick-look-prev" title="Página Anterior (←)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="quick-look-canvas-container" id="quick-look-canvas-container">
          <canvas id="quick-look-canvas"></canvas>
        </div>
        <button type="button" class="quick-look-nav next" id="quick-look-next" title="Próxima Página (→)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <div class="quick-look-footer">
        <span class="quick-look-hint">Dica: Use as setas <kbd>←</kbd> <kbd>→</kbd> do teclado para folhear • <kbd>Esc</kbd> ou <kbd>Espaço</kbd> para fechar</span>
      </div>
    </div>
  </div>

  <!-- Modal Toast na frente com Overlay -->
  <div id="save-toast-overlay" class="save-toast-overlay hidden">
    <div id="save-toast" class="save-toast"></div>
  </div>

  <!-- Modal para Desbloquear PDF com Senha -->
  <div id="password-modal-overlay" class="password-modal-overlay hidden">
    <div class="password-modal-card">
      <div class="password-modal-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h3 class="password-modal-title">PDF Protegido por Senha</h3>
      <p id="password-modal-filename" class="password-modal-subtitle">Digite a senha para desbloquear este documento:</p>
      
      <form id="password-modal-form" onsubmit="event.preventDefault();">
        <div class="password-input-wrapper">
          <input type="password" id="password-modal-input" placeholder="Senha do documento" autocomplete="off" />
          <button type="button" id="password-modal-toggle-eye" class="password-eye-btn" title="Mostrar/ocultar senha">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div id="password-modal-error" class="password-modal-error hidden"></div>
        <div class="password-modal-actions">
          <button type="button" id="password-modal-cancel" class="btn-secondary">Cancelar</button>
          <button type="submit" id="password-modal-submit" class="action-btn">Desbloquear</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Lógica da aplicação -->
  <script src="js/app.js"></script>
</body>
</html>
