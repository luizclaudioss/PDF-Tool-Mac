<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Tool</title>
  <link rel="stylesheet" href="css/app.css" />
  <!-- Bibliotecas locais offline -->
  <script src="vendor/pdf-lib.min.js"></script>
  <script src="vendor/pdf.min.js"></script>
</head>
<body>
  <!-- Barra de título integrada ao estilo nativo do macOS -->
  <header class="mac-titlebar">
    <div class="mac-titlebar-drag"></div>
    <div class="mac-titlebar-content">
      <div class="mac-app-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 2H6C4.89543 2 4 2.89543 4 4V20C4 21.1046 4.89543 22 6 22H18C19.1046 22 20 21.1046 20 20V8L14 2Z" fill="#E5322D"/>
          <path d="M14 2V8H20L14 2Z" fill="#B91C1C"/>
          <text x="6.5" y="17" fill="white" font-size="6.5" font-weight="900" font-family="-apple-system, sans-serif">PDF</text>
        </svg>
      </div>
      <span class="mac-app-title">PDF Tool</span>
    </div>
  </header>

  <main>
    <!-- Tela Inicial com os 6 cards de ferramentas -->
    <div id="home-screen">
      <div class="hero-header">
        <h1>PDF Tool</h1>
        <p class="subtitle">Organize, combine, divida, gire e converta seus PDFs de maneira simples e rápida.</p>
      </div>
      <div class="grid" id="tool-grid"></div>
    </div>

    <!-- Área de Trabalho / Workspace de cada ferramenta -->
    <div class="workspace" id="workspace">
      <div class="workspace-top-bar">
        <button class="back-btn" onclick="goHome()">
          <span class="back-arrow">←</span> Voltar às ferramentas
        </button>
      </div>
      <div id="workspace-content"></div>
    </div>
  </main>

  <footer class="mac-footer">
    <div class="footer-left">PDF Tool • Edição Nativa macOS</div>
    <div class="footer-right">100% Offline e Seguro</div>
  </footer>

  <!-- Lógica da aplicação -->
  <script src="js/app.js"></script>
</body>
</html>
