<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Tool</title>
  <link rel="stylesheet" href="css/app.css" />
  <!-- Bibliotecas locais offline -->
  <script src="vendor/pdf-lib.min.js"></script>
  <script src="vendor/pdf.min.js"></script>
</head>
<body>

  <main>
    <!-- Tela Inicial com os 6 cards de ferramentas -->
    <div id="home-screen">
      <div class="hero-header">
        <h1>PDF Tool</h1>
        <p class="subtitle">Organize, combine, divida, gire e converta seus PDFs de maneira simples e rápida.</p>
      </div>
      <div class="grid" id="tool-grid"></div>
    </div>

    <!-- Área de Trabalho / Workspace de cada ferramenta -->
    <div class="workspace" id="workspace">
      <div class="workspace-top-bar">
        <button class="back-btn" onclick="goHome()">
          <span class="back-arrow">←</span> Voltar às ferramentas
        </button>
      </div>
      <div id="workspace-content"></div>
    </div>
  </main>

  <!-- Lógica da aplicação -->
  <script src="js/app.js"></script>
</body>
</html>
